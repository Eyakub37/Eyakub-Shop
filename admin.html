  <style>
:root{--green:#16c784;--dark:#071522;--navy:#0b2030;--soft:#f5f7fa;--text:#14212b;--muted:#6b7785;--danger:#e5484d;--line:#e5e9ee}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--soft);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:50}.topbar{max-width:1250px;margin:auto;display:flex;align-items:center;gap:18px;padding:13px 18px}.logo{font-size:30px;font-weight:900;white-space:nowrap}.logo span{color:var(--green)}.search{flex:1;display:flex;max-width:560px;margin:auto}.search input{width:100%;padding:13px 16px;border-radius:10px 0 0 10px;border:0;outline:0}.search button{width:54px;background:var(--green);border-radius:0 10px 10px 0}.top-actions{display:flex;gap:10px;align-items:center}.top-actions button,.nav button{background:transparent;color:#fff}.cart-btn{position:relative;font-size:16px}.count{position:absolute;top:-9px;right:-10px;background:#e53935;color:#fff;border-radius:20px;font-size:11px;padding:3px 6px}.nav{background:#fff;color:var(--text);border-bottom:1px solid var(--line)}.nav-inner{max-width:1250px;margin:auto;display:flex;gap:22px;padding:10px 18px;overflow:auto}.nav button{color:var(--text);white-space:nowrap;padding:10px 8px}.nav button.active{color:var(--green);font-weight:800;border-bottom:3px solid var(--green)}

.footer{background:var(--dark);color:#fff;margin-top:40px;padding:35px 18px}.footer-inner{max-width:1250px;margin:auto;display:flex;justify-content:space-between;gap:30px}.footer a{color:#54e5a0;text-decoration:none}

let category="সব";

function saveProducts(){localStorage.setItem("eyakub_products",JSON.stringify(products))}

function money(n){return "৳ "+Number(n).toLocaleString("bn-BD")}
function setCategory(c,btn){category=c;document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");renderProducts()}

function renderProducts(){
 const q=(document.getElementById("search").value||"").trim().toLowerCase();
 const list=products.filter(p=>p.active&&matchCategory(p)&&(!q||(p.name+" "+p.description).toLowerCase().includes(q)));
 document.getElementById("resultCount").textContent=list.length+"টি পণ্য";
 const g=document.getElementById("productGrid");
 if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">কোনো পণ্য পাওয়া যায়নি।</div>';return}
 g.innerHTML=list.map(p=>`<article class="card">
   <div class="pic"><img loading="lazy" src="${imgSrc(p)}" alt="${esc(p.name)}">${p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}</div>
   <div class="card-body"><div class="name">${esc(p.name)}</div><div class="meta">⭐ 4.${(p.id.charCodeAt(2)%5)+5} · Stock ${p.stock}</div><div class="price">${money(p.price)} <span class="old">${money(p.oldPrice)}</span></div><div class="meta">Size: ${p.sizes.join(", ")}</div><button class="add" onclick="addToCart('${p.id}')">🛒 কার্টে যোগ করুন</button></div>
 </article>`).join("")
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;let x=cart.find(i=>i.id===id);if(x)x.qty++;else cart.push({id,qty:1});saveCart();openCart()}
function updateCartCount(){document.getElementById("cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0)}
function openCart(){document.getElementById("cartDrawer").classList.add("open");renderCart()}
function closeCart(){document.getElementById("cartDrawer").classList.remove("open")}
function changeQty(id,d){const x=cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);saveCart();renderCart()}
function renderCart(){
 const box=document.getElementById("cartItems");if(!cart.length){box.innerHTML='<div class="empty">কার্ট খালি</div>';document.getElementById("cartTotal").innerHTML="";return}
 let total=0;box.innerHTML=cart.map(i=>{const p=products.find(x=>x.id===i.id);if(!p)return"";total+=p.price*i.qty;return `<div class="cart-item"><img src="${imgSrc(p)}"><div><b>${esc(p.name)}</b><div>${money(p.price)} × ${i.qty}</div><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><b>${i.qty}</b><button onclick="changeQty('${p.id}',1)">+</button></div></div><button class="danger" onclick="changeQty('${p.id}',-999)">✕</button></div>`}).join("");
 document.getElementById("cartTotal").innerHTML=`<h3>মোট: ${money(total)}</h3>`
}
function openCheckout(){if(!cart.length){alert("আগে পণ্য কার্টে যোগ করুন।");return}closeCart();let total=0;document.getElementById("checkoutSummary").innerHTML="<div class='panel'>"+cart.map(i=>{const p=products.find(x=>x.id===i.id);total+=p.price*i.qty;return `${esc(p.name)} × ${i.qty} — ${money(p.price*i.qty)}`}).join("<br>")+`<hr><b>মোট: ${money(total)}</b></div>`;document.getElementById("checkoutModal").classList.add("open")}
function closeCheckout(){document.getElementById("checkoutModal").classList.remove("open")}
function placeOrder(){
 const name=document.getElementById("cName").value.trim(),phone=document.getElementById("cPhone").value.trim(),address=document.getElementById("cAddress").value.trim();
 if(!name||!phone||!address){alert("নাম, মোবাইল ও ঠিকানা দিন।");return}
 let total=0;let lines=cart.map(i=>{const p=products.find(x=>x.id===i.id);total+=p.price*i.qty;return `• ${p.name} | Qty: ${i.qty} | ${money(p.price*i.qty)}`}).join("\\n");
 const orderNo="EY"+Date.now().toString().slice(-8);
 const msg=`Eyakub Shop - নতুন অর্ডার\\nঅর্ডার: ${orderNo}\\n\\n${lines}\\n\\nমোট: ${money(total)}\\nনাম: ${name}\\nমোবাইল: ${phone}\\nঠিকানা: ${address}\\nশহর: ${document.getElementById("cCity").value}\\nপেমেন্ট: ${document.getElementById("cPayment").value}\\nডেলিভারি: ${document.getElementById("cDelivery").value}\\nসাইজ: ${document.getElementById("cSize").value}\\nনোট: ${document.getElementById("cNote").value}`;
 window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
 cart=[];saveCart();closeCheckout();alert("অর্ডারের WhatsApp মেসেজ তৈরি হয়েছে। Send চাপলেই অর্ডার পাঠানো হবে।");
}
function openFacebook(){window.open(FB,"_blank")}
/* Admin */
let adminLogged=localStorage.getItem("eyakub_admin_logged")==="1";
function openAdmin(){document.getElementById("adminModal").classList.add("open");renderAdmin()}
function closeAdmin(){document.getElementById("adminModal").classList.remove("open")}
function renderAdmin(){
 const a=document.getElementById("adminContent");
 if(!adminLogged){a.innerHTML=`<div class="login"><h2>🔐 Admin Login</h2><div class="hint">ডিফল্ট লগইন: <b>admin</b> / <b>Eyakub@123</b><br>গুরুত্বপূর্ণ: এটি GitHub Pages-এর browser-only admin। বাস্তব নিরাপত্তার জন্য Supabase/Auth backend লাগবে।</div><br><div class="field"><label>Username</label><input id="au" value="admin"></div><br><div class="field"><label>Password</label><input id="ap" type="password"></div><br><button class="save" onclick="login()">Login</button></div>`;return}
 a.innerHTML=`<h2>⚙️ Eyakub Shop Admin Panel</h2><div class="admin-tabs"><button class="on" onclick="adminProducts()">Products</button><button onclick="adminOrders()">Orders</button><button onclick="logout()">Logout</button></div><div id="adminView"></div>`;adminProducts()
}
function login(){if(document.getElementById("au").value==="admin"&&document.getElementById("ap").value==="Eyakub@123"){adminLogged=true;localStorage.setItem("eyakub_admin_logged","1");renderAdmin()}else alert("Username বা password ভুল।")}
function logout(){adminLogged=false;localStorage.removeItem("eyakub_admin_logged");renderAdmin()}
function adminProducts(){
 const v=document.getElementById("adminView");
 v.innerHTML=`<div class="admin-grid"><div class="panel"><h3>➕ নতুন পণ্য</h3>${productForm("new")}</div><div class="panel"><h3>📦 300+ পণ্য</h3><input id="adminSearch" placeholder="পণ্য খুঁজুন..." oninput="adminTable()" style="width:100%;padding:10px;border:1px solid #ccd5dd;border-radius:8px"><div id="atable"></div></div></div>`;adminTable()
}
function productForm(mode,p={}){
 return `<div class="form-grid">
 <div class="field full"><label>পণ্যের নাম *</label><input id="${mode}Name" value="${esc(p.name||"")}"></div>
 <div class="field"><label>দাম *</label><input id="${mode}Price" type="number" value="${p.price||""}"></div>
 <div class="field"><label>পুরনো দাম</label><input id="${mode}Old" type="number" value="${p.oldPrice||""}"></div>
 <div class="field"><label>Stock</label><input id="${mode}Stock" type="number" value="${p.stock??10}"></div>
 <div class="field"><label>Badge</label><input id="${mode}Badge" value="${esc(p.badge||"")}"></div>
 <div class="field full"><label>বিবরণ</label><textarea id="${mode}Desc" rows="3">${esc(p.description||"")}</textarea></div>
 <div class="field full"><label>ছবি (Choose File)</label><input id="${mode}File" type="file" accept="image/*"></div>
 <div class="field full"><label>অথবা Image URL</label><input id="${mode}Image" value="${esc(p.image||"")}"></div>
 <div class="field full"><label>Sizes</label><input id="${mode}Sizes" value="${esc((p.sizes||["39","40","41","42","43","44","45"]).join(", "))}"></div>
 </div><br><button class="save" onclick="${mode==="new"?"createProduct()":"updateProduct('"+p.id+"')"}">${mode==="new"?"পণ্য যোগ করুন":"Save Changes"}</button>`
}
function adminTable(){
 const q=(document.getElementById("adminSearch")?.value||"").toLowerCase();const list=products.filter(p=>p.name.toLowerCase().includes(q));
 document.getElementById("atable").innerHTML=`<table class="admin-table"><tr><th>ছবি</th><th>নাম</th><th>দাম</th><th>Stock</th><th>Action</th></tr>${list.map(p=>`<tr><td><img src="${imgSrc(p)}"></td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button onclick="editProduct('${p.id}')">✏️</button> <button class="danger" onclick="deleteProduct('${p.id}')">🗑️</button></td></tr>`).join("")}</table>`
}
function readForm(prefix,old){
 const f=document.getElementById(prefix+"File"),url=document.getElementById(prefix+"Image").value.trim();
 return {name:document.getElementById(prefix+"Name").value.trim(),price:Number(document.getElementById(prefix+"Price").value||0),oldPrice:Number(document.getElementById(prefix+"Old").value||0),stock:Number(document.getElementById(prefix+"Stock").value||0),badge:document.getElementById(prefix+"Badge").value.trim(),description:document.getElementById(prefix+"Desc").value.trim(),image:url,sizes:document.getElementById(prefix+"Sizes").value.split(",").map(x=>x.trim()).filter(Boolean),active:true,id:old?.id||("p"+Date.now()),file:f.files[0]}
}
function fileToData(file){return new Promise((res,rej)=>{if(!file)return res(null);let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function createProduct(){const x=readForm("new");if(!x.name||!x.price){alert("নাম ও দাম দিন");return}if(x.file)x.image=await fileToData(x.file);delete x.file;products.unshift(x);saveProducts();adminProducts();alert("পণ্য যোগ হয়েছে।")}
async function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById("adminView").innerHTML=`<div class="panel"><h3>✏️ পণ্য কাস্টমাইজ</h3>${productForm("edit",p)}<br><button class="danger" onclick="adminProducts()">Cancel</button></div>`}
async function updateProduct(id){const old=products.find(x=>x.id===id);const x=readForm("edit",old);if(x.file)x.image=await fileToData(x.file);else x.image=old.image;delete x.file;Object.assign(old,x);saveProducts();adminProducts();alert("পণ্য আপডেট হয়েছে।")}
function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p||!confirm("এই পণ্যটি ডিলিট করবেন?"))return;products=products.filter(x=>x.id!==id);saveProducts();adminProducts()}
function adminOrders(){document.getElementById("adminView").innerHTML='<div class="panel"><h3>📋 Orders</h3><p>এই static GitHub Pages সংস্করণে অর্ডার WhatsApp-এ পাঠানো হয়। স্থায়ী Order Database/Admin Order Management-এর জন্য Supabase backend প্রয়োজন।</p></div>'}

renderAdmin();
</script>
 </body>
</html>
