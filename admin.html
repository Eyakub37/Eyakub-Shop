<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eyakub Shop Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
}

.container{
    max-width:650px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:100px;
}

button{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:0;
    border-radius:7px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.logout{
    background:#d32f2f;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

#adminPanel{
    display:none;
}

.product{
    border:1px solid #ddd;
    padding:15px;
    margin-top:12px;
    border-radius:8px;
    background:#fafafa;
}

.delete{
    background:#d32f2f;
}

.edit{
    background:#1976d2;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Eyakub Shop Admin</h1>

<!-- LOGIN -->

<div id="loginPanel">

<h2>Admin Login</h2>

<label>Username</label>
<input type="text" id="username" placeholder="Enter username">

<label>Password</label>
<input type="password" id="password" placeholder="Enter password">

<button onclick="login()">Login</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

<button class="logout" onclick="logout()">Logout</button>

<h2>Add Product</h2>

<label>Product Name</label>
<input type="text" id="name" placeholder="Men's Running Shoes">

<label>Category</label>

<select id="category">

<option value="">Select Category</option>

<option>Men's Shoes</option>
<option>Women's Shoes</option>
<option>Bags</option>
<option>Clothing</option>
<option>Accessories</option>
<option>Cosmetics</option>
<option>Electronics</option>

</select>

<label>Price (৳)</label>
<input type="number" id="price" placeholder="1500">

<label>Discount Price (৳)</label>
<input type="number" id="discount" placeholder="1200">

<label>Image URL</label>
<input type="text" id="image" placeholder="https://example.com/image.jpg">

<label>Description</label>
<textarea id="description" placeholder="Product details"></textarea>

<button onclick="addProduct()">Add Product</button>

<div id="productMessage" class="message"></div>

<hr style="margin:30px 0">

<h2>Products</h2>

<div id="products"></div>

</div>

</div>

</div>


<script>

const USERNAME = "eyakubadmin";
const PASSWORD = "Eyakub@2026";


function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(username === USERNAME && password === PASSWORD){

        localStorage.setItem(
            "eyakubAdmin",
            "true"
        );

        document.getElementById("loginPanel").style.display="none";

        document.getElementById("adminPanel").style.display="block";

        showProducts();

    }else{

        document.getElementById("loginMessage").style.color="red";

        document.getElementById("loginMessage").innerText =
            "Wrong Username or Password!";

    }

}


function logout(){

    localStorage.removeItem("eyakubAdmin");

    document.getElementById("adminPanel").style.display="none";

    document.getElementById("loginPanel").style.display="block";

}


function addProduct(){

    const name =
        document.getElementById("name").value;

    const category =
        document.getElementById("category").value;

    const price =
        document.getElementById("price").value;

    const discount =
        document.getElementById("discount").value;

    const image =
        document.getElementById("image").value;

    const description =
        document.getElementById("description").value;


    if(!name || !category || !price){

        alert("Product Name, Category এবং Price দিন");

        return;
    }


    const product = {

        id:Date.now(),

        name:name,

        category:category,

        price:price,

        discount:discount,

        image:image,

        description:description

    };


    let products =
        JSON.parse(
            localStorage.getItem("eyakubProducts")
        ) || [];


    products.push(product);


    localStorage.setItem(
        "eyakubProducts",
        JSON.stringify(products)
    );


    document.getElementById("productMessage").style.color="green";

    document.getElementById("productMessage").innerText =
        "Product Added Successfully!";


    document.getElementById("name").value="";
    document.getElementById("category").value="";
    document.getElementById("price").value="";
    document.getElementById("discount").value="";
    document.getElementById("image").value="";
    document.getElementById("description").value="";


    showProducts();

}


function showProducts(){

    const box =
        document.getElementById("products");

    const products =
        JSON.parse(
            localStorage.getItem("eyakubProducts")
        ) || [];


    box.innerHTML="";


    if(products.length === 0){

        box.innerHTML =
            "<p>এখনো কোনো Product Add করা হয়নি।</p>";

        return;

    }


    products.forEach(function(product){

        const div =
            document.createElement("div");

        div.className="product";


        div.innerHTML = `

        <strong>${product.name}</strong>

        <br>

        Category: ${product.category}

        <br>

        Price: ৳${product.price}

        <br>

        Discount Price: ৳${product.discount || "N/A"}

        <br><br>

        <button class="delete"
        onclick="deleteProduct(${product.id})">

        Delete Product

        </button>

        `;


        box.appendChild(div);

    });

}


function deleteProduct(id){

    let products =
        JSON.parse(
            localStorage.getItem("eyakubProducts")
        ) || [];


    products =
        products.filter(
            product => product.id !== id
        );


    localStorage.setItem(
        "eyakubProducts",
        JSON.stringify(products)
    );


    showProducts();

}


if(
    localStorage.getItem("eyakubAdmin")
    === "true"
){

    document.getElementById("loginPanel").style.display="none";

    document.getElementById("adminPanel").style.display="block";

    showProducts();

}

</script>

</body>
</html>
